name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storybook exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Check committed API artifacts
        run: |
          git diff --exit-code -- apps/api/openapi packages/api-client/src/generated
          test -z "$(git ls-files --others --exclude-standard -- apps/api/openapi packages/api-client/src/generated)"
      - run: pnpm --filter @workspace/database test:compose
