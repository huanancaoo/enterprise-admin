packages:
  - "apps/*"
  - "packages/*"

# Linux 容器挂载工作区执行 Local 存储验收，需要同时安装本机和 Linux 的图片解码依赖。
supportedArchitectures:
  os: [current, linux]
  cpu: [current]
  libc: [glibc, musl]

allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  cpu-features: false
  esbuild: true
  msw: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.5"
  - "@better-auth/drizzle-adapter@1.7.5"
  - "@nestjs/cli@12.0.1"
  - "@nestjs/common@12.0.2"
  - "@nestjs/core@12.0.2"
  - "@nestjs/platform-express@12.0.2"
  - "@nestjs/schematics@12.0.2"
  - "@nestjs/testing@12.0.2"
  - "@turbo/darwin-64@2.10.13"
  - "@turbo/darwin-arm64@2.10.13"
  - "@turbo/gen@2.10.13"
  - "@turbo/linux-64@2.10.13"
  - "@turbo/linux-arm64@2.10.13"
  - "@turbo/windows-64@2.10.13"
  - "@turbo/windows-arm64@2.10.13"
  - auth@1.7.5
  - better-auth@1.7.5
  - eslint-plugin-react-refresh@0.5.7
  - lucide-react@1.46.0
  - turbo@2.10.13
  - "@better-auth/kysely-adapter@1.7.5"
  - "@better-auth/memory-adapter@1.7.5"
  - "@better-auth/mongo-adapter@1.7.5"
  - "@better-auth/prisma-adapter@1.7.5"
  - "@better-auth/telemetry@1.7.5"
  - i18next-cli@1.73.3
  - "@fumadocs/base-ui@16.15.12"
  - "@fumadocs/json-schema@0.2.0"
  - fumadocs-core@16.15.12
  - fumadocs-mdx@15.4.2
  - fumadocs-openapi@12.0.0

engineStrict: true
saveExact: true

# 发行扫描发现的运行传递依赖漏洞；固定到上游已修复版本。
overrides:
  "@grpc/grpc-js": "1.14.5"
  "proxy-addr": "2.0.8"
  "undici@6": "6.28.1"
  "source-map-js": "1.2.2"
  # Nest/Vite 应用不使用这些 Better Auth 可选适配器；各工具自身的直接依赖保留。
  "better-auth>next": "-"
  "better-auth>drizzle-kit": "-"
  "better-auth>vitest": "-"

peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12.0.2"
    "@nestjs/core": "12.0.2"
