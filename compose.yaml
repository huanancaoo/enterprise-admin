services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: bootstrap_admin
      POSTGRES_DB: enterprise_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?Set APP_MIGRATOR_PASSWORD}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD}
      PLATFORM_RUNTIME_PASSWORD: ${PLATFORM_RUNTIME_PASSWORD:?Set PLATFORM_RUNTIME_PASSWORD}
      PLATFORM_DEPLOYER_PASSWORD: ${PLATFORM_DEPLOYER_PASSWORD:?Set PLATFORM_DEPLOYER_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap_admin -d enterprise_admin"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.5-bookworm@sha256:90e7a336d044f1abc9e9dbc05d65566850896d11453bbd1dd0fb7e5059f0e8fb
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  worker:
    build:
      context: .
      dockerfile: infra/release/Dockerfile
      target: worker
    init: true
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD}@postgres:5432/enterprise_admin
      REDIS_URL: redis://redis:6379
      WORKER_QUEUE_NAME: organization-tasks
      WORKER_QUEUE_PREFIX: jobs
      WORKER_SHUTDOWN_MS: "30000"
volumes:
  postgres_data:
  redis_data:
