services:
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: ["/data"]
    env_file:
      - ./infra/storage/.env
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

volumes:
  rustfs_data:
